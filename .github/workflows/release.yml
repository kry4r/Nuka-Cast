name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;20.1.5948944"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NUKACAST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "NUKACAST_KEYSTORE_BASE64 is missing"; exit 1; }
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/nukacast-release.jks

      - name: Build web control
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Verify embedded web assets are current
        run: git diff --exit-code -- app/src/main/assets/web

      - name: Test and build signed release
        shell: bash
        env:
          NUKACAST_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nukacast-release.jks
          NUKACAST_KEYSTORE_PASSWORD: ${{ secrets.NUKACAST_KEYSTORE_PASSWORD }}
          NUKACAST_KEY_ALIAS: ${{ secrets.NUKACAST_KEY_ALIAS }}
          NUKACAST_KEY_PASSWORD: ${{ secrets.NUKACAST_KEY_PASSWORD }}
        run: |
          set -o pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            --stacktrace \
            --console=plain 2>&1 | tee gradle-release.log

      - name: Summarize Gradle failure
        if: failure() && hashFiles('gradle-release.log') != ''
        shell: bash
        run: |
          {
            echo "### Gradle failure"
            echo '```text'
            tail -n 120 gradle-release.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and name release files
        shell: bash
        run: |
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          OUT="dist/NukaCast-${GITHUB_REF_NAME}.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep "lib/armeabi-v7a/libnukacast_airplay.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libnukacast_airplay.so"
          ! unzip -l "$APK" | grep -q "lib/x86_64/"
          cp "$APK" "$OUT"
          (
            cd dist
            sha256sum "NukaCast-${GITHUB_REF_NAME}.apk" \
              > "NukaCast-${GITHUB_REF_NAME}.apk.sha256"
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/NukaCast-*.apk
            dist/NukaCast-*.apk.sha256
