name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;20.1.5948944"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NUKACAST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "NUKACAST_KEYSTORE_BASE64 is missing"; exit 1; }
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/nukacast-release.jks

      - name: Build web control
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test and build signed release
        shell: bash
        env:
          NUKACAST_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nukacast-release.jks
          NUKACAST_KEYSTORE_PASSWORD: ${{ secrets.NUKACAST_KEYSTORE_PASSWORD }}
          NUKACAST_KEY_ALIAS: ${{ secrets.NUKACAST_KEY_ALIAS }}
          NUKACAST_KEY_PASSWORD: ${{ secrets.NUKACAST_KEY_PASSWORD }}
        run: |
          set -o pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            --stacktrace \
            --console=plain 2>&1 | tee gradle-release.log

      - name: Summarize Gradle failure
        if: failure() && hashFiles('gradle-release.log') != ''
        shell: bash
        run: |
          {
            echo "### Gradle failure"
            echo '```text'
            tail -n 120 gradle-release.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and name release files
        shell: bash
        run: |
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          OUT="dist/NukaCast-${GITHUB_REF_NAME}.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NukaCast-*.apk
            dist/NukaCast-*.apk.sha256
