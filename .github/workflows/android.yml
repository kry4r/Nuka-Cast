name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;20.1.5948944"

      - name: Build web control
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Verify embedded web assets are current
        run: git diff --exit-code -- app/src/main/assets/web

      - name: Test, lint and assemble
        shell: bash
        run: |
          set -o pipefail
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --stacktrace \
            --console=plain 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure() && hashFiles('gradle-build.log') != ''
        shell: bash
        run: |
          {
            echo "### Gradle failure"
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERROR_LINE="$(grep -E '(^FAILURE:|^\* What went wrong:|^[[:space:]]*> |Exception|Error:)' gradle-build.log | tail -n 1 || true)"
          ERROR_LINE="${ERROR_LINE//'%'/'%25'}"
          ERROR_LINE="${ERROR_LINE//$'\r'/'%0D'}"
          ERROR_LINE="${ERROR_LINE//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${ERROR_LINE:-See the Gradle failure summary for details.}"

      - name: Verify APK contract
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep "sdkVersion:'17'"
          echo "$BADGING" | grep "native-code:.*'armeabi-v7a'"
          echo "$BADGING" | grep "native-code:.*'arm64-v8a'"
          unzip -l "$APK" | grep "lib/armeabi-v7a/libnukacast_airplay.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libnukacast_airplay.so"
          ! unzip -l "$APK" | grep -q "lib/x86_64/"
          unzip -l "$APK" | grep "assets/web/index.html"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NukaCast-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            gradle-build.log
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install native test toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;20.1.5948944"
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run API 35 instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/run-instrumentation.sh

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NukaCast-instrumentation-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            instrumentation-logcat.txt
            application-crash.txt
          retention-days: 14
