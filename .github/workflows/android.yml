name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;20.1.5948944"

      - name: Build web control
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test, lint and assemble
        shell: bash
        run: |
          set -o pipefail
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --stacktrace \
            --console=plain 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure() && hashFiles('gradle-build.log') != ''
        shell: bash
        run: |
          {
            echo "### Gradle failure"
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERROR_LINE="$(grep -E '(^FAILURE:|^\* What went wrong:|^[[:space:]]*> |Exception|Error:)' gradle-build.log | tail -n 1 || true)"
          ERROR_LINE="${ERROR_LINE//'%'/'%25'}"
          ERROR_LINE="${ERROR_LINE//$'\r'/'%0D'}"
          ERROR_LINE="${ERROR_LINE//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${ERROR_LINE:-See the Gradle failure summary for details.}"

      - name: Verify APK contract
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep "sdkVersion:'17'"
          echo "$BADGING" | grep "native-code: 'armeabi-v7a'"
          unzip -l "$APK" | grep "lib/armeabi-v7a/libnukacast_airplay.so"
          unzip -l "$APK" | grep "assets/web/index.html"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NukaCast-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            gradle-build.log
          retention-days: 14
