plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("NUKACAST_KEYSTORE_PATH")

android {
    namespace "com.nukacast.app"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.nukacast.app"
        minSdk 17
        targetSdk 28
        multiDexEnabled true
        versionCode project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 2
        versionName project.hasProperty("versionName") ? project.property("versionName") : "0.2.0"

        ndk {
            abiFilters "armeabi-v7a"
        }

        testInstrumentationRunner "android.test.InstrumentationTestRunner"

        externalNativeBuild {
            cmake {
                abiFilters "armeabi-v7a"
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("NUKACAST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NUKACAST_KEY_ALIAS")
                keyPassword System.getenv("NUKACAST_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    ndkVersion "20.1.5948944"

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable "ExpiredTargetSdkVersion"
    }

    packaging {
        resources.excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt"
        ]
    }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "org.nanohttpd:nanohttpd-websocket:2.3.1"
    implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.6"
    implementation "com.google.android.exoplayer:exoplayer-core:2.17.1"
    implementation "com.google.android.exoplayer:exoplayer-hls:2.17.1"
    implementation "com.google.android.exoplayer:exoplayer-dash:2.17.1"
    implementation "org.jmdns:jmdns:3.5.8"
    implementation "jcifs:jcifs:1.3.17"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "junit:junit:4.13.2"
}
