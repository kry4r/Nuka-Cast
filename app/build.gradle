plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("NUKACAST_KEYSTORE_PATH")
def debugAbis = ["armeabi-v7a", "arm64-v8a"]
if (project.hasProperty("includeTestAbi")) debugAbis.add("x86_64")
if (project.hasProperty("includeLegacyTestAbi")) debugAbis.add("x86")

android {
    namespace "com.nukacast.app"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.nukacast.app"
        minSdk 17
        targetSdk 35
        multiDexEnabled true
        versionCode project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 9
        versionName project.hasProperty("versionName") ? project.property("versionName") : "0.3.3"

        ndk {
            abiFilters(*debugAbis)
        }

        testInstrumentationRunner "com.nukacast.app.NukaCastTestRunner"

        externalNativeBuild {
            cmake {
                abiFilters(*debugAbis)
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("NUKACAST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NUKACAST_KEY_ALIAS")
                keyPassword System.getenv("NUKACAST_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    ndkVersion "20.1.5948944"

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Navigation icons are intentionally authored once for a fixed-density TV surface.
        disable "ExpiredTargetSdkVersion", "IconMissingDensityFolder", "ChromeOsAbiSupport"
    }

    packaging {
        resources.excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt"
        ]
    }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    // 1.0.0 is already part of the API 17-compatible AndroidX graph used by this app.
    //noinspection GradleDependency
    implementation "androidx.collection:collection:1.0.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.jsoup:jsoup:1.13.1"
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "org.nanohttpd:nanohttpd-websocket:2.3.1"
    implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.6"
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.5"
    implementation "com.google.android.exoplayer:exoplayer-hls:2.18.5"
    implementation "com.google.android.exoplayer:exoplayer-dash:2.18.5"
    // 2.14.2 is the last OkHttp extension release that supports API 16-19.
    implementation "com.google.android.exoplayer:extension-okhttp:2.14.2"
    implementation "org.jmdns:jmdns:3.5.8"
    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"

    testImplementation "junit:junit:4.13.2"
    // Last AndroidX Test line compatible with the app's API 17 floor.
    //noinspection GradleDependency
    androidTestImplementation "androidx.test:runner:1.5.2"
    //noinspection GradleDependency
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
